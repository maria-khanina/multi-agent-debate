services:
  redis:
    image: redis:alpine
    container_name: debate_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  debate-app:
    build: .
    container_name: debate_app
    depends_on:
      - redis
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./:/app  
      - ./debate_vectors:/app/debate_vectors
    command: tail -f /dev/null
  
  ollama:
    image: alpine/ollama:latest
    container_name: ollama_service
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama

volumes:
  redis_data:
  ollama_models:
