services:
  redis:
    image: redis:alpine
    container_name: debate_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  debate-app:
    build: .
    container_name: debate_app
    depends_on:
      - redis
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - REDIS_URL=redis://redis:6379/0
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}
      - LANGFUSE_BASE_URL=${LANGFUSE_BASE_URL:-https://cloud.langfuse.com}
    volumes:
      - ./:/app  
      - ./debate_vectors:/app/debate_vectors
    command: tail -f /dev/null
volumes:
  redis_data:
